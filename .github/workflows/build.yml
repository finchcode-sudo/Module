name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;34.0.0" "build-tools;36.0.0" "build-tools;37.0.0"
          sudo ln -sfn "$SDK" /opt/android-sdk

      - name: Prepare keystore
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.KS_PASS }}
          KS_ALIAS_SECRET: ${{ secrets.KS_ALIAS }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
            echo "KS_ALIAS=$KS_ALIAS_SECRET" >> "$GITHUB_ENV"
          else
            echo "No signing secrets, using a temporary debug keystore"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass android -keypass android -alias debug \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=debug"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
            echo "KS_ALIAS=debug" >> "$GITHUB_ENV"
          fi
          echo "KS_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        working-directory: LShareModSRC
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LShareMod
          path: LShareModSRC/build/LShareMod.apk
